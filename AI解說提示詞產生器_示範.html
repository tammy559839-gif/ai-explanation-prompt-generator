<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>AI解說提示詞產生器｜晟景科技</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--bg:#f5f3ee;--main:#1f4d3d;--gold:#b08a3e;--text:#1c1c1a;--surface:#fffdf8;--line:#c8c6be;--muted:#5d625b;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.8 "Noto Sans TC",sans-serif}main{max-width:860px;margin:auto;padding:48px 28px}h1{font-size:clamp(26px,4vw,38px);line-height:1.5;font-weight:700;border-left:5px solid var(--gold);padding-left:20px;margin:0 0 14px}p{margin:8px 0 20px}.intro{color:var(--muted)}h2,legend{font-size:18px;font-weight:700}label{display:block;font-weight:700;margin-bottom:8px}input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:12px 14px;font:inherit;color:var(--text)}button{cursor:pointer;font:inherit;background:var(--main);border:1px solid var(--main);border-radius:2px;color:#fff;padding:10px 18px}button.secondary{background:transparent;color:var(--main)}.examples{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 26px}.examples button{font-size:13px;padding:5px 10px;background:transparent;color:var(--main);border-color:var(--line)}.reader{margin-bottom:26px}fieldset{border:0;margin:0;padding:0}legend{margin:0 0 12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{position:relative}.card input{position:absolute;left:12px;top:12px;accent-color:var(--main);width:16px;height:16px}.card label{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:42px 14px 16px;height:100%;border-radius:2px;margin:0;line-height:1.6}.card b{display:block;font-size:16px}.card span{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:5px}.card input:checked+label{background:var(--main);color:#fff;border-color:var(--main)}.card input:checked+label span{color:#fff}.card input:focus-visible+label{outline:3px solid var(--gold);outline-offset:3px}.result{margin-top:34px;padding-top:20px;border-top:4px solid var(--main)}.result h2{margin:0 0 4px}.result .description{font-size:14px;color:var(--muted)}pre{background:var(--surface);border:1px solid var(--line);padding:22px;margin:14px 0 18px;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.9;min-height:130px}button:focus-visible,input:focus-visible,select:focus-visible,pre:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.actions{display:flex;gap:10px;flex-wrap:wrap}.message{min-height:32px;font-size:14px;color:var(--main);margin:10px 0}footer{border-top:1px solid var(--line);margin-top:32px;padding-top:18px;display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}a{color:var(--main)}@media(max-width:640px){main{padding:28px 18px}.cards{grid-template-columns:repeat(2,1fr)}pre{padding:16px;font-size:15px}footer{flex-direction:column}}@media(prefers-color-scheme:dark){:root{--bg:#141b17;--main:#9acbb4;--gold:#d0b16d;--text:#edf1eb;--surface:#1b2921;--line:#4a5b50;--muted:#b5c1b7;color-scheme:dark}button{color:#12271b}.card input:checked+label{background:#1f4d3d;color:#fff}.card input:checked{accent-color:#b6ddc8}}
</style></head><body><main><header><h1>想搞懂一個主題，先選解說方式</h1><p class="intro">輸入主題、選讀者與解說方式，複製提示詞貼到 Claude。</p></header><label for="topic">想理解什麼？</label><input id="topic" type="text" maxlength="500" placeholder="例如：SIPOC" autocomplete="off"><div class="examples"><button type="button" data-example="SIPOC">SIPOC</button><button type="button" data-example="工程變更流程">工程變更流程</button><button type="button" data-example="AI 成熟度模型 L1–L5">AI 成熟度模型 L1–L5</button></div><div class="reader"><label for="reader">讀者是誰？</label><select id="reader"><option>第一次接觸這個主題的讀者</option><option>要做決策的主管</option><option>有經驗的同業</option></select></div><fieldset><legend>希望怎麼理解？</legend><div class="cards"><div class="card"><input type="radio" name="format" value="text" id="text" checked><label for="text"><b>快速讀懂</b><span>簡潔文字</span></label></div><div class="card"><input type="radio" name="format" value="diagram" id="diagram"><label for="diagram"><b>看懂流程與關係</b><span>圖解</span></label></div><div class="card"><input type="radio" name="format" value="web" id="web"><label for="web"><b>調參數、看變化</b><span>互動網頁</span></label></div><div class="card"><input type="radio" name="format" value="video" id="video"><label for="video"><b>看動態講解</b><span>解說影片</span></label></div></div></fieldset><section class="result" aria-labelledby="format-name"><h2 id="format-name">簡潔文字</h2><p class="description" id="description">用短句與具體例子，理解核心概念。</p><pre id="output" tabindex="0">先輸入想理解的主題。</pre><div class="actions"><button id="copy" type="button">一鍵複製提示詞</button><button id="select" type="button" class="secondary">選取全文</button></div><p class="message" id="message" role="status" aria-live="polite"></p></section><footer><span>晟景科技 SCENDIA</span></footer></main>
<script id="templates" type="application/json">[{"id": "text", "name": "簡潔文字", "template": "請用中文解釋「{{主題}}」，對象是{{讀者}}。\n\n借用 ASD-STE100 的清晰寫作原則：\n1. 句子要短，每句盡量不超過 30 個字。\n2. 一句只講一件事。\n3. 同一個概念從頭到尾用同一個詞。\n4. 用主動語態，每句的主詞要清楚。\n5. 避免堆疊名詞，術語第一次出現時要白話說明。\n\n先說核心概念，再用一個具體例子說明。最後簡短列出這次省略、可再深入的細節。這是中文寫作建議，不要求符合官\n方英文標準。"}, {"id": "diagram", "name": "圖解", "template": "請用一張圖解釋「{{主題}}」，對象是{{讀者}}。\n\n圖上要標出：\n1. 關鍵元件。\n2. 元件之間的關係。\n3. 流程方向；若沒有先後順序，不要畫成流程。\n\n每個標籤盡量不超過 10 個字，術語附簡短白話說明。不要用長篇文字代替圖解。\n若無法直接生成圖片，請輸出可在 Mermaid 線上編輯器使用的程式碼。"}, {"id": "web", "name": "互動網頁", "template": "請用 HTML 做一個單頁互動網頁，解釋「{{主題}}」，對象是{{讀者}}。\n\n網頁要有：\n1. 核心概念的白話說明。\n2. 可以點開查看的段落說明。\n3. 一個可以調整參數、即時看到結果變化的互動元件。若不適合數值模擬，改用可切換條件的互動。\n\n標明參數意義、結果單位、計算規則與簡化假設。示意數字要註明，不能假稱真實資料。\n所有 HTML、CSS、JavaScript 放在同一個 .html 檔案，不串接 API，讓手機和桌機都能使用。"}, {"id": "video", "name": "解說影片", "template": "請製作一支主題為「{{主題}}」的中文解說影片，對象是{{讀者}}。\n\n參考 3Blue1Brown 的動畫講解方式：用清楚的圖形與動態變化，逐步呈現概念，不要只播放文字投影片。\n\n先確認環境能執行程式、安裝所需依賴及渲染影片，再選擇適合的工具，例如 Manim。先規畫分鏡，再執行程式、渲染\n並檢查影片。\n\n預設製作中文字幕版，不需要配音。若加配音，優先考慮免費本機方案；不要把付費語音 API 視為必要。\n提供可播放的影片檔與製作程式碼；若環境無法渲染，明確說明缺少的條件。"}]</script><script id="engine">
const TEMPLATES=JSON.parse(document.getElementById('templates').textContent);
function makePrompt(format,topic,reader){const item=TEMPLATES.find(t=>t.id===format);if(!item)throw Error('未知解說方式');if(!topic.trim())return '';return item.template.replace(/\{\{(主題|讀者)\}\}/g,(_,key)=>key==='主題'?topic.trim():reader);}
</script><script id="app">
const $=id=>document.getElementById(id);let current='';const descriptions={text:'用短句與具體例子，理解核心概念。',diagram:'用關鍵元件、關係與方向，整理概念。',web:'透過調整參數或切換條件，觀察變化。',video:'產生影片製作提示詞，再交給具備渲染能力的AI環境執行。'};
function update(){const format=document.querySelector('input[name="format"]:checked').value;current=makePrompt(format,$('topic').value,$('reader').value);$('format-name').textContent=TEMPLATES.find(t=>t.id===format).name;$('description').textContent=descriptions[format];$('output').textContent=current||'先輸入想理解的主題。';$('message').textContent='';}
function ready(){if(current)return true;$('message').textContent='請先輸入主題';$('topic').focus();return false;}
function selectAll(){if(!ready())return false;const range=document.createRange();range.selectNodeContents($('output'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);return true;}
$('topic').addEventListener('input',update);$('reader').addEventListener('change',update);document.querySelectorAll('input[name="format"]').forEach(r=>r.addEventListener('change',update));document.querySelectorAll('[data-example]').forEach(b=>b.addEventListener('click',()=>{$('topic').value=b.dataset.example;update();$('topic').focus();}));$('select').addEventListener('click',()=>{if(selectAll())$('message').textContent='已選取全文，請按 Ctrl＋C（Mac：Command＋C）。';});$('copy').addEventListener('click',async()=>{if(!ready())return;try{if(!navigator.clipboard||!window.isSecureContext)throw Error('clipboard unavailable');await navigator.clipboard.writeText(current);$('message').textContent='已複製提示詞，可以貼到 Claude。';}catch{selectAll();$('message').textContent='無法自動複製，已選取全文，請按 Ctrl＋C（Mac：Command＋C）。';}});update();
</script></body></html>
